<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#1858e8" />

    <!-- Brand Identity & Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Preload Brand Assets for Splash Screen -->
    <link rel="preload" as="image" href="/brand/logo-icon.png" />
    <link rel="preload" as="image" href="/brand/logo-icon-dark.png" />

    <!-- Primary Meta Tags -->
    <title>Mock Interview AI | Practice. Analyze. Get Hired.</title>
    <meta name="title" content="Mock Interview AI | Practice. Analyze. Get Hired." />
    <meta name="description" content="AI-Powered Multimodal Mock Interview Preparation Platform featuring real-time speech acoustics, computer vision, facial composure, and STAR method evaluations." />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="http://localhost:5173/" />
    <meta property="og:title" content="Mock Interview AI | Practice. Analyze. Get Hired." />
    <meta property="og:description" content="Master your next tech interview with multimodal AI evaluation across computer vision, speech acoustics, emotional composure, and STAR methodology." />
    <meta property="og:image" content="/brand/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Mock Interview AI | Practice. Analyze. Get Hired." />
    <meta property="twitter:description" content="Master your next tech interview with multimodal AI evaluation across computer vision, speech acoustics, emotional composure, and STAR methodology." />
    <meta property="twitter:image" content="/brand/og-image.png" />

    <!-- Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
      // Prevent Flash of Unstyled Content (FOUC) for system, white, black, blue
      (function() {
        try {
          const VALID_THEMES = ['system', 'white', 'black', 'blue'];
          let stored = localStorage.getItem('mock_interview_theme') || localStorage.getItem('theme');
          if (stored === 'dark') stored = 'system';
          if (stored === 'light') stored = 'white';
          const theme = (stored && VALID_THEMES.indexOf(stored) !== -1) ? stored : 'system';
          
          let isDark = false;
          let color = '#FFFFFF';
          
          if (theme === 'black') {
            isDark = true;
            color = '#000000';
          } else if (theme === 'blue') {
            isDark = true;
            color = '#0B1B3F';
          } else if (theme === 'white') {
            isDark = false;
            color = '#FFFFFF';
          } else {
            // system
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            isDark = prefersDark;
            color = prefersDark ? '#000000' : '#FFFFFF';
          }
          
          const root = document.documentElement;
          root.setAttribute('data-theme', theme);
          if (isDark) {
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.style.colorScheme = 'light';
          }
          
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', color);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'system');
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen font-sans antialiased transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
